name: Docker Image CI

on:
  push:
    branches: [ "master", "*" ]
    tags:
      - v*
env:
  IMAGE_NAME: alpine-supervisord

jobs:
  scan_alpine_tags:
    name: Scan alpine tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Scan Docker Repository
        uses: dhet/scan-docker-tags-action@v1.0.1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          image: alpine
          max-age-minutes: 15
          tag-regex: ^3\.
        id: scan_alpine_tags
      - name: Print
        run: "echo 'Recent updates: ${{ steps.scan_alpine_tags.outputs.tags }}'"
